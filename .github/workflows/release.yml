# Publica um APK assinado no GitHub Releases a cada tag vX.Y.Z (ex.: git tag v0.2.0 && git push origin v0.2.0).
# Segredos do repositório (Settings › Secrets and variables › Actions):
#   DMACRO_KEYSTORE_BASE64  conteúdo do .jks em base64
#   DMACRO_STORE_PASSWORD   senha do keystore
#   DMACRO_KEY_ALIAS        alias da chave (ex.: dmacro)
#   DMACRO_KEY_PASSWORD     senha da chave
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O padrão da ação inclui o pacote "tools", que não existe mais no sdkmanager atual.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão a partir da tag
        id: versao
        run: |
          nome="${GITHUB_REF_NAME#v}"
          base="${nome%%-*}"
          IFS=. read -r maior menor correcao <<< "$base"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "codigo=$(( maior * 10000 + menor * 100 + ${correcao:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Testes
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.DMACRO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Segredo DMACRO_KEYSTORE_BASE64 ausente"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dmacro-release.jks"

      - name: APK release
        env:
          DMACRO_STORE_FILE: ${{ runner.temp }}/dmacro-release.jks
          DMACRO_STORE_PASSWORD: ${{ secrets.DMACRO_STORE_PASSWORD }}
          DMACRO_KEY_ALIAS: ${{ secrets.DMACRO_KEY_ALIAS }}
          DMACRO_KEY_PASSWORD: ${{ secrets.DMACRO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ steps.versao.outputs.nome }} -PversionCode=${{ steps.versao.outputs.codigo }}

      - name: Conferir assinatura e preparar arquivos
        run: |
          apk="D-Macro-v${{ steps.versao.outputs.nome }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          rm -f "$RUNNER_TEMP/dmacro-release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          name: D-Macro ${{ steps.versao.outputs.nome }}
          files: |
            D-Macro-v${{ steps.versao.outputs.nome }}.apk
            D-Macro-v${{ steps.versao.outputs.nome }}.apk.sha256
          prerelease: ${{ contains(steps.versao.outputs.nome, '-') }}
          generate_release_notes: true
